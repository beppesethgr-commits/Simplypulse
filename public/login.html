<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SimplyPulse – Accesso</title><link rel="stylesheet" href="/styles.css"></head>
<body><div class="login"><form class="card" id="f">
<h1 class="brand">Simply<span>Pulse</span></h1><div style="color:var(--mut)">Accedi alla dashboard</div>
<input name="u" placeholder="Utente" autocomplete="username" required autofocus>
<input name="p" type="password" placeholder="Password" autocomplete="current-password" required>
<div class="err" id="e" role="alert"></div><button>Accedi</button></form></div>
<script>
f.onsubmit=async ev=>{ev.preventDefault();e.textContent='';
const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:f.u.value,password:f.p.value})});
if(r.ok)location.href='/';else e.textContent=(await r.json()).error||'Errore';};
</script></body></html>
